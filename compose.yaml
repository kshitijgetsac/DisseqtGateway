services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_demo_only
    ports:
      - "5432:5432"
    volumes:
      - gateway_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 3s
      timeout: 2s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://gateway:gateway_demo_only@db:5432/gateway
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 3s
      timeout: 2s
      retries: 20
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://gateway:gateway_demo_only@db:5432/gateway
    depends_on:
      api:
        condition: service_healthy
volumes:
  gateway_db:
